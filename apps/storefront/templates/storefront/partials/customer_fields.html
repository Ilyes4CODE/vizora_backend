<input type="hidden" name="stamp" value="{{ stamp }}">
<div class="trap" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="fields">
<label class="field{% if errors.name %} has-error{% endif %}">{{ t.full_name }}<input type="text" name="name" autocomplete="name" required minlength="3" maxlength="150" value="{{ values.name|default:'' }}"{% if errors.name %} aria-invalid="true"{% endif %}>{% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}</label>
<label class="field{% if errors.phone %} has-error{% endif %}">{{ t.your_phone }}<input class="tel" type="tel" name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="{{ t.phone_placeholder }}" value="{{ values.phone|default:'' }}"{% if errors.phone %} aria-invalid="true"{% endif %}>{% if errors.phone %}<span class="field-error">{{ errors.phone }}</span>{% endif %}</label>
<label class="field{% if errors.wilaya %} has-error{% endif %}">{{ t.wilaya }}<select name="wilaya" required autocomplete="address-level1"{% if errors.wilaya %} aria-invalid="true"{% endif %}><option value="">{{ t.choose_wilaya }}</option>{% for row in wilayas %}<option value="{{ row.code }}"{% if values.wilaya|stringformat:"s" == row.code|stringformat:"s" %} selected{% endif %}>{{ row.code|stringformat:"02d" }} · {{ row.name }}</option>{% endfor %}</select>{% if errors.wilaya %}<span class="field-error">{{ errors.wilaya }}</span>{% endif %}</label>
<label class="field{% if errors.commune %} has-error{% endif %}">{{ t.commune }}<select name="commune" required autocomplete="address-level2" data-placeholder="{{ t.choose_commune }}" data-waiting="{{ t.choose_wilaya_first }}" data-selected="{{ values.commune|default:'' }}"{% if not values.wilaya %} disabled{% endif %}{% if errors.commune %} aria-invalid="true"{% endif %}><option value="">{% if values.wilaya %}{{ t.choose_commune }}{% else %}{{ t.choose_wilaya_first }}{% endif %}</option>{% if values.commune %}<option value="{{ values.commune }}" selected>{{ values.commune }}</option>{% endif %}</select>{% if errors.commune %}<span class="field-error">{{ errors.commune }}</span>{% endif %}</label>
</div>
<fieldset class="seg">
<legend>{{ t.delivery_place }}</legend>
<div class="seg-options">
<label><input type="radio" name="delivery_type" value="home"{% if values.delivery_type != 'desk' %} checked{% endif %}><span>{{ t.home }}</span></label>
<label><input type="radio" name="delivery_type" value="desk"{% if values.delivery_type == 'desk' %} checked{% endif %}><span>{{ t.desk }}</span></label>
</div>
{% if errors.delivery_type %}<span class="field-error">{{ errors.delivery_type }}</span>{% endif %}
</fieldset>
<div data-address{% if values.delivery_type == 'desk' %} hidden{% endif %}>
<label class="field{% if errors.address %} has-error{% endif %}">{{ t.address }}<input type="text" name="address" autocomplete="street-address" maxlength="255" placeholder="{{ t.address_placeholder }}" value="{{ values.address|default:'' }}"{% if errors.address %} aria-invalid="true"{% endif %}>{% if errors.address %}<span class="field-error">{{ errors.address }}</span>{% endif %}</label>
</div>
<label class="field">{{ t.note }}<input type="text" name="note" maxlength="300" value="{{ values.note|default:'' }}"></label>
<script type="application/json" id="wilaya-data">{{ wilayas_json|safe }}</script>
